#!/usr/sbin/nft -f
# Firewall of the Vigie server (installed as /etc/nftables.conf by setup.sh): only SSH, HTTP and HTTPS come in.
# The containers are rootless: their traffic is the host's own (pasta), nothing is forwarded.
flush ruleset

table inet filter {
	chain input {
		type filter hook input priority filter; policy drop;
		ct state established,related accept
		ct state invalid drop
		iif lo accept
		# Ping, and IPv6 neighbour discovery (without it IPv6 stops working).
		meta l4proto { icmp, ipv6-icmp } accept
		# The provider's DHCP (IPv4) and DHCPv6 answers.
		udp dport { 68, 546 } accept
		tcp dport { 22, 80, 443 } accept
		# HTTP/3.
		udp dport 443 accept
	}
	chain forward {
		type filter hook forward priority filter; policy drop;
	}
	chain output {
		type filter hook output priority filter; policy accept;
	}
}
